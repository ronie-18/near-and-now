# Builds the Vite SPA and publishes it to S3 behind CloudFront.
#
# One-time setup (see AWS_MIGRATION_PLAN.md, Phase 4):
#   - S3 bucket        : nearandnow-web-prod (private, OAC access from CloudFront only)
#   - CloudFront dist.  : default root index.html, 403/404 → /index.html (SPA routing)
#   - GitHub OIDC role  : secrets.AWS_DEPLOY_ROLE_ARN
#   - Repo variables    : AWS_REGION, WEB_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#   - Repo secrets      : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GOOGLE_MAPS_API_KEY, VITE_API_URL
name: Deploy frontend to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck & test
        run: |
          npx tsc --noEmit -p frontend/tsconfig.json
          npx vitest run --root frontend

      - name: Build (env vars are baked in at build time)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npx vite build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets (immutable, cached for a year)
        run: |
          aws s3 sync frontend/dist/assets "s3://${{ vars.WEB_BUCKET }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload everything else (short cache so new deploys show up quickly)
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.WEB_BUCKET }}" \
            --exclude "assets/*" \
            --delete \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/"
